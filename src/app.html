<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0a0a0b" />
		<meta name="color-scheme" content="dark light" />
		<meta name="robots" content="noindex, nofollow" />
		<meta
			name="description"
			content="Private AI performance coach: adaptive programming, fast workout logging and training analytics."
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Coach" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>
			// Apply the saved theme before first paint (see src/lib/client/preferences.svelte.ts).
			try {
				var t = JSON.parse(localStorage.getItem('pc:prefs:v1') || '{}').theme;
				if (t === 'light' || t === 'system') {
					document.documentElement.dataset.theme = t;
					var l = t === 'light' || matchMedia('(prefers-color-scheme: light)').matches;
					if (l) document.querySelector('meta[name="theme-color"]').content = '#f4f4f0';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
