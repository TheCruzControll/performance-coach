<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0a0a0b" />
		<meta name="color-scheme" content="dark light" />
		<meta name="robots" content="noindex, nofollow" />
		<meta
			name="description"
			content="Private AI performance coach: adaptive programming, fast workout logging and training analytics."
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Coach" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- The Graphite 2004 preview's stylesheet and font, filled in by the server (see
		     hooks.server.ts); fetched only when that design is chosen. -->
		<meta name="pc-graphite" content="%pc.graphite.stylesheet%" data-font="%pc.graphite.font%" />
		<script>
			// Allowed by the CSP through its sha256 hash, computed from this file in vite.config.ts.
			// Note when the page starts being left, from its first moment: a navigation away can
			// start before the app's code has loaded (see src/lib/client/leaving.ts).
			addEventListener('beforeunload', function () {
				window.__pcLeftAt = Date.now();
			});
			addEventListener('pagehide', function () {
				window.__pcLeftAt = Date.now();
			});
			addEventListener('pageshow', function (e) {
				// Only a restore from the back/forward cache ends it: a page's first `pageshow` can
				// arrive after a navigation away has already started.
				if (e.persisted) window.__pcLeftAt = undefined;
			});
			// Apply the saved theme before first paint (see src/lib/client/preferences.svelte.ts).
			try {
				var t = JSON.parse(localStorage.getItem('pc:prefs:v1') || '{}').theme;
				if (t === 'light' || t === 'system') {
					document.documentElement.dataset.theme = t;
					var l = t === 'light' || matchMedia('(prefers-color-scheme: light)').matches;
					if (l) {
						document.querySelector('meta[name="theme-color"]').content = '#f4f4f0';
						// Dark status-bar text on the light canvas in an installed iOS web app.
						document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
							'default';
					}
				}
			} catch (e) {}
			// Apply the chosen design before first paint (see src/lib/client/design.ts): today's
			// unless this device chose the Graphite 2004 preview, here or with ?design=graphite.
			// `__pcDesign` also switches it while the page is open.
			window.__pcDesign = function (d) {
				var root = document.documentElement;
				var links = document.querySelectorAll('link[data-design]');
				if (d !== 'graphite') {
					delete root.dataset.design;
					for (var i = 0; i < links.length; i++) links[i].remove();
					return;
				}
				root.dataset.design = d;
				var meta = document.querySelector('meta[name="pc-graphite"]');
				if (links.length || !meta || meta.content.charAt(0) === '%') return;
				var font = document.createElement('link');
				font.rel = 'preload';
				font.as = 'font';
				font.type = 'font/woff2';
				font.crossOrigin = 'anonymous';
				font.href = meta.dataset.font;
				var sheet = document.createElement('link');
				sheet.rel = 'stylesheet';
				sheet.href = meta.content;
				// A stylesheet a script inserts blocks rendering only when asked to: no flash of today's.
				sheet.setAttribute('blocking', 'render');
				font.dataset.design = sheet.dataset.design = d;
				document.head.append(font, sheet);
			};
			window.__pcDesign(
				(function (asked) {
					try {
						if (asked !== 'graphite' && asked !== 'current') {
							return localStorage.getItem('pc:design:v1');
						}
						localStorage.setItem('pc:design:v1', asked);
					} catch (e) {}
					return asked;
				})(new URLSearchParams(location.search).get('design'))
			);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
