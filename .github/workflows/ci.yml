# Continuous integration: every pull request and every push to main.
# Jobs run in parallel; each is independently reproducible locally (see docs/testing.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older run. Every other run (each merge
# to main, a manual run) has a group of its own, so it always finishes. One group for all of main
# would leave merges untested: cancel-in-progress stops the running one, and even without it a
# newer run replaces the one still waiting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Local-style databases inside the postgres:18 container each database job starts, created by
  # db:setup (postgres:18 matches the Neon production branch).
  DATABASE_URL: postgres://coach:coach@localhost:5432/coach_dev
  DATABASE_URL_UNPOOLED: postgres://coach:coach@localhost:5432/coach_dev
  TEST_DATABASE_URL: postgres://coach:coach@localhost:5432/coach_test
  E2E_DATABASE_URL: postgres://coach:coach@localhost:5432/coach_e2e
  EXPLAIN_DATABASE_URL: postgres://coach:coach@localhost:5432/coach_explain
  PGADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the secrets scan sees every commit main and this PR hold.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier + ESLint incl. import boundaries)
        run: pnpm lint
      # Provider-format secrets in the tracked tree, then in every commit reachable from HEAD
      # (scripts/secrets-scan.ts; fixtures are allowlisted by fingerprint in .secrets-allowlist.json).
      - name: Secrets in the tracked tree
        run: pnpm security:scan
      - name: Secrets in the history
        run: pnpm security:scan --history
      - name: Type-check (svelte-check + service worker tsc)
        run: pnpm check
      - name: Migrations match the schema (no drift)
        run: pnpm db:drift

  # Unit tests never reach a database, so they run apart from the integration tests and
  # finish while the integration job is still starting its Postgres.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests & query plans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pulled and started in the background (docker run -d would block on the pull), so the
      # server boots while the job installs; "Wait for Postgres" holds db:setup until it answers.
      - name: Start Postgres 18 (in the background)
        run: nohup sh -c 'docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres postgres:18' > "$RUNNER_TEMP/postgres-start.log" 2>&1 &
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Over TCP: the image's init server listens on its socket only, so ready means the real
      # server. 90 s covers a cold pull plus initdb; a server that never answers fails the job.
      - name: Wait for Postgres
        env:
          WAIT_SECONDS: 90
        run: |
          for _ in $(seq "$WAIT_SECONDS"); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not accept TCP connections within ${WAIT_SECONDS} s"
          cat "$RUNNER_TEMP/postgres-start.log"
          docker logs postgres
          exit 1
      - name: Create roles and databases
        run: pnpm db:setup
      - name: Apply migrations (dev database)
        run: pnpm db:migrate
      - name: Integration tests (real Postgres, committed migrations)
        run: pnpm test:integration
      # The history and program queries' plans on a two-year dataset: on a large table, each
      # builder's declared index and no sequential scan (scripts/explain/, docs/development.md).
      - name: Query plans (db:explain)
        run: pnpm db:explain
      - name: Upload the query plans
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: explain-${{ github.run_id }}
          path: test-results/explain.md
          retention-days: 14
          if-no-files-found: ignore

  # The check branch protection requires, under the combined job's old name: green only when both
  # jobs are. always(), not !cancelled(): a required check skipped in a cancelled run would count
  # as passing. Pull requests only, as the E2E check below.
  test:
    name: Unit & integration tests
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unit and integration tests passed
        env:
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          if [ "$UNIT" != success ] || [ "$INTEGRATION" != success ]; then
            echo "::error::Unit tests: $UNIT; integration tests: $INTEGRATION"
            exit 1
          fi

  build:
    name: Build (Vercel + Node) & budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A canary, not a key: both builds see it, and pnpm budgets fails if it, an sk-ant- key or
    # the Anthropic SDK reaches a client file of either build (scripts/client-secret-scan.ts).
    env:
      ANTHROPIC_API_KEY: ci-canary-anthropic-key-never-in-a-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for Vercel (production target)
        run: pnpm build
      - name: Build for Node (used by e2e and Lighthouse)
        run: pnpm build:node
      - name: Performance budgets
        run: pnpm budgets

  # The browser suite in parallel legs, one per group and engine (e2e/projects.ts LEGS: main, the
  # functional specs; serial, the one-at-a-time specs; alone, perf, and exclusive, both on
  # Chromium), each with its own Postgres, database and production server.
  # Ceiling: 15 Playwright minutes per leg or shard (scripts/e2e-timing.ts warns above it). A leg
  # nearing it gains a shard (`of` up by one, plus an entry per new shard), never less coverage.
  # `minutes` is the Playwright step's timeout: 1.5 × the leg's slowest of three measured runs,
  # at least 5 (the projects' minutes in main's runs 42355809914, 42356551780 and 42356562301).
  # main split in two after runs 42415186404 to 42431687521 peaked at 14.9 (Chromium) and 11.5
  # (WebKit) minutes: each shard is estimated at half plus a minute of server setup (8.4, 6.8).
  # serial·webkit split the same way after peaking at 15.2 (timed out in 42431006875): 8.6 a shard.
  # Its two shards then grew alike to 13.7-14.6 Playwright minutes each (runs 42695476716 to
  # 42698046025), so it split in four: about 7 a shard. Three would leave it the longest leg.
  # serial·chromium peaked at 9.3 in 42414341167 to 42431687521 (14 unsharded), then timed out
  # at 14 in 42469172500 with tests still passing, so it split in two the same way. Its shards
  # took 7.3-8.8 Playwright minutes in 42695476716 to 42698046025, no more than main's.
  # Then the legs took more shards at about the same runner-minutes, so the longest leg, not the
  # sum, sets a run's wall clock: main·webkit 3, serial·chromium 3, serial·webkit 5 (14 entries,
  # 22 jobs a pull-request run, 20 starting at once). main·chromium stayed in two: its a11y files
  # alone (484 s over 2 workers) would have made shard 1 of three the heaviest, which the rule then
  # forbade (it also runs any file the plan missed; scripts/e2e-shards.test.ts fails at three).
  # Predicted Playwright steps at runs 42712377736 and 42711097021's speed: main·webkit ~274 s,
  # serial·chromium ~330 s, serial·webkit ~326 s, alone 204-224 s. main·chromium's two shards
  # took 392-455 s there, so it stayed the longest leg (for its third shard, see the end).
  # alone·chromium ran 4.9 of its 5 minutes on main (42914798868, 42916363395) and timed out once
  # M4's workout screens joined the budgets (42933643722), so it split in two, each shard a runner
  # of its own, perf still alone on it: ~150 s of specs a shard at that run's speed. exclusive left
  # it for a leg of its own first: perf is its dependency, so a shard with it would run all of perf.
  # Every shard holds whole files, planned by measured seconds, or estimated ones for spec files
  # the table lacks (scripts/e2e-shards.ts).
  # Shard timeouts stay at the unsharded leg's value until three runs per shard are measured.
  # main legs run 2 Playwright workers (playwright.config.ts), alone and exclusive 1; main's
  # `minutes` stay at their 1-worker values until three 2-worker runs are measured.
  # serial legs run one worker per owner world (a database and a production server each,
  # e2e/worlds.ts), as many as e2e/serial-workers.ts sets for the engine: the one place, with the
  # measurements. Two workers share the runner's 4 vCPUs: in 43172816565 a serial·chromium spec
  # file took 1.15× its 1-worker time, so serial·chromium runs 2 and went from 3 shards to 2 (8.5
  # and 8.8 job minutes there). A serial·webkit one took 1.39×, and its heaviest tests passed their
  # 30 s timeout, attempt and retry (43178306850), so serial·webkit runs 1 again. In 5 shards, as
  # before, its shards took 8.6-11.8 job minutes (43186419116; 9.4-11.6 in 43170932662): about
  # 100 s of setup on top of their specs. So it went to 6, ~385-425 s of specs a shard at the
  # timing table's speed, about 9 job minutes. Measured since, in main's six green runs
  # 43197965258 to 43232612790 (the timing table's runs): serial·webkit's slowest shard took 10.0
  # Playwright minutes, so its `minutes` stay 15 (1.5 × 10.0). serial·chromium's took 10.8 (16.2
  # at 1.5×), and its 14 is unchanged: never raised to fit, it gains a shard if it nears 14.
  # Those runs took 10.8-15.6 minutes, against a 10-minute goal: serial·chromium's and
  # main·chromium's slowest shards took 10.8 Playwright minutes, serial·webkit's 10.0. Replayed on
  # their per-file seconds with the spec files of today, a third shard for each Chromium leg and
  # two more for serial·webkit bring every leg's slowest shard to 8.7 minutes at most (median and
  # max: main·chromium 6.3 and 7.0, serial·chromium 7.7 and 8.5, serial·webkit 8.1 and 8.1;
  # main·webkit stays at 7.8 and 8.7). serial·webkit in 7 would still reach 9.1 (8.4 median).
  # main·chromium's a11y files (642 s over 2 workers) then fill shard 1 by themselves at 321 s,
  # 3 s more than shards 2 and 3: the planner puts nothing else there, and the rule allows a
  # shard 1 holding only those files to be heavier by less than its 10% (SHARD_ONE_SHARE).
  # main·chromium's `minutes` drop to 17: 1.5 × its slowest 2-worker shard in those runs (10.8).
  # serial·chromium keeps 14 and serial·webkit 15, as above, until their new shards are measured.
  e2e-legs:
    name: E2E ${{ matrix.group }} · ${{ matrix.engine }} · ${{ matrix.shard }}/${{ matrix.of }}
    # Pinned to the newest Ubuntu release Playwright builds WebKit for (its browser builds are
    # "ubuntu-24.04"). On ubuntu-latest (26.04) WebKit's ~140 MB of system packages came
    # through a cold mirror at ~50 KB/s and the install timed out before any test ran.
    runs-on: ubuntu-24.04
    # The longest Playwright step (1.5 × the 15-minute ceiling, 23), the installs (12 + 8) and 2.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: main, engine: chromium, shard: 1, of: 3, minutes: 17 }
          - { group: main, engine: chromium, shard: 2, of: 3, minutes: 17 }
          - { group: main, engine: chromium, shard: 3, of: 3, minutes: 17 }
          - { group: main, engine: webkit, shard: 1, of: 3, minutes: 13 }
          - { group: main, engine: webkit, shard: 2, of: 3, minutes: 13 }
          - { group: main, engine: webkit, shard: 3, of: 3, minutes: 13 }
          - { group: serial, engine: chromium, shard: 1, of: 3, minutes: 14 }
          - { group: serial, engine: chromium, shard: 2, of: 3, minutes: 14 }
          - { group: serial, engine: chromium, shard: 3, of: 3, minutes: 14 }
          - { group: serial, engine: webkit, shard: 1, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 2, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 3, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 4, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 5, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 6, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 7, of: 8, minutes: 15 }
          - { group: serial, engine: webkit, shard: 8, of: 8, minutes: 15 }
          - { group: alone, engine: chromium, shard: 1, of: 2, minutes: 5 }
          - { group: alone, engine: chromium, shard: 2, of: 2, minutes: 5 }
          - { group: exclusive, engine: chromium, shard: 1, of: 1, minutes: 5 }
    steps:
      - uses: actions/checkout@v7
      # Pulled and started in the background (docker run -d would block on the pull), so the
      # server boots while the job installs; "Wait for Postgres" holds db:setup until it answers.
      - name: Start Postgres 18 (in the background)
        run: nohup sh -c 'docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres postgres:18' > "$RUNNER_TEMP/postgres-start.log" 2>&1 &
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser builds are per OS release (WebKit links that release's ICU), so the cache is
      # keyed by the runner image: a WebKit downloaded on ubuntu-26.04 fails to launch on 24.04.
      - name: Runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Measured on 40+ runs: install-deps took about 20 s, but on bad days its unconditional
      # `apt-get update` stalled on the Ubuntu mirror for the whole 12 minutes (6 legs in two
      # hours), with every package already in the cache. The cache now carries apt's lists too,
      # keyed by the exact package set, so a full cache installs with no network at all; see
      # scripts/ci-playwright-deps.sh. A new runner image saves a fresh copy. Chromium legs
      # launch only Chromium; WebKit legs also need it for the owner setup. The set differs, so
      # does the key: a WebKit leg never restores a Chromium leg's smaller cache.
      - name: Playwright system packages
        id: apt
        run: ./scripts/ci-playwright-deps.sh key ${{ matrix.engine == 'webkit' && 'chromium webkit' || 'chromium' }} >> "$GITHUB_OUTPUT"
      - name: Cache Playwright system packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-playwright
          key: apt-playwright-v2-${{ steps.image.outputs.os }}-${{ steps.apt.outputs.packages }}-${{ steps.apt.outputs.image }}
          restore-keys: apt-playwright-v2-${{ steps.image.outputs.os }}-${{ steps.apt.outputs.packages }}-
      - name: Install Playwright system dependencies
        # Bounded update and download attempts inside; dpkg runs once, never killed midway.
        timeout-minutes: 12
        run: ./scripts/ci-playwright-deps.sh install ~/.cache/apt-playwright ${{ matrix.engine == 'webkit' && 'chromium webkit' || 'chromium' }}
      - name: Install Playwright browsers
        # Usually restored from the cache above. A stuck download is safe to kill: bound and retry.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 pnpm exec playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::browser download attempt ${attempt} failed or timed out; retrying"
            sleep 5
          done
          echo "::error::browser download failed 3 times"
          exit 1
      # Over TCP: the image's init server listens on its socket only, so ready means the real
      # server. 90 s covers a cold pull plus initdb; a server that never answers fails the job.
      - name: Wait for Postgres
        env:
          WAIT_SECONDS: 90
        run: |
          for _ in $(seq "$WAIT_SECONDS"); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not accept TCP connections within ${WAIT_SECONDS} s"
          cat "$RUNNER_TEMP/postgres-start.log"
          docker logs postgres
          exit 1
      - name: Create roles and databases
        run: pnpm db:setup
      # Each shard runs the spec files scripts/e2e-shards.ts plans for it from e2e/ and
      # e2e/timings.json (--test-list; shard 1 inverts the others' union, so a file the plan missed
      # runs there). The arguments are read first, so a planner failure fails the step rather than
      # run the whole leg.
      - name: Playwright (global setup builds and starts the production Node server)
        timeout-minutes: ${{ matrix.minutes }}
        env:
          E2E_ENGINE: ${{ matrix.engine }}
          E2E_GROUP: ${{ matrix.group }}
          E2E_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          shard_args=$(node scripts/e2e-shards.ts "$RUNNER_TEMP/e2e-shard-tests.txt")
          pnpm test:e2e $shard_args
      # Also planned vs measured seconds per file against e2e/timings.json for this leg.
      - name: Where the minutes went
        if: ${{ !cancelled() }}
        env:
          E2E_ENGINE: ${{ matrix.engine }}
          E2E_GROUP: ${{ matrix.group }}
          E2E_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node scripts/e2e-timing.ts test-results/report.json "${{ matrix.group }} · ${{ matrix.engine }}"
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}-${{ matrix.group }}-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            .e2e-server*.log
          # The production servers' logs (one per owner world in serial·chromium legs) are dot-files,
          # which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # The check branch protection requires: green only when every leg is. It runs even when a leg
  # fails, since a skipped required check would count as passing. Required checks gate only pull
  # requests, so pushes and manual runs skip it: there the run's own result already fails on a
  # failed leg, and this job would only queue behind every pull request's jobs (an hour at peak).
  e2e:
    name: E2E (iPhone viewport · Chromium + WebKit)
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [e2e-legs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          LEGS: ${{ needs.e2e-legs.result }}
        run: |
          if [ "$LEGS" != success ]; then
            echo "::error::E2E legs: $LEGS"
            exit 1
          fi

  # Lighthouse in parallel shards (scripts/lighthouse.ts --shard i/N): shard i audits every N-th
  # screen of the full list, the routes and then the seeded program screens, so a slice that adds
  # a route changes nothing here. Each shard builds, seeds and serves on its own Postgres.
  # Ceiling: 15 Lighthouse minutes per shard. A shard nearing it gains a sibling (`of` up by one,
  # plus an entry per new shard), never fewer routes or runs.
  # Step timeout: 1.5 × the slowest of the unsharded job's measured mobile runs (7.0 minutes in
  # main's runs 42735820629, 42736181926 and 42737223258: 11), until three runs per shard are
  # measured; each shard does about half of that work. Desktop is measured in a job of its own,
  # unsharded and never gating (lighthouse-desktop, below).
  lighthouse-shards:
    name: Lighthouse (mobile) · ${{ matrix.shard }}/${{ matrix.of }}
    # The e2e Chromium legs' image, so their saved system packages and browsers restore here
    # with no network (keys carry the image). Lighthouse's throttling is simulated, so the image
    # does not move its scores.
    runs-on: ubuntu-24.04
    # The Lighthouse step (11), the installs (12 + 8), and 2 for checkout, install and build.
    timeout-minutes: 33
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, of: 2 }
          - { shard: 2, of: 2 }
    steps:
      - uses: actions/checkout@v7
      # Pulled and started in the background (docker run -d would block on the pull), so the
      # server boots while the job installs; "Wait for Postgres" holds db:setup until it answers.
      - name: Start Postgres 18 (in the background)
        run: nohup sh -c 'docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres postgres:18' > "$RUNNER_TEMP/postgres-start.log" 2>&1 &
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser builds are per OS release (WebKit links that release's ICU), so the cache is
      # keyed by the runner image: a WebKit downloaded on ubuntu-26.04 fails to launch on 24.04.
      - name: Runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The e2e legs' cached install (see the comment there): a full cache installs with no
      # network, so an Ubuntu mirror outage cannot fail the audit. Same image, same key: the
      # legs' saved copy restores here.
      - name: Playwright system packages
        id: apt
        run: ./scripts/ci-playwright-deps.sh key chromium >> "$GITHUB_OUTPUT"
      - name: Cache Playwright system packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-playwright
          key: apt-playwright-v2-${{ steps.image.outputs.os }}-${{ steps.apt.outputs.packages }}-${{ steps.apt.outputs.image }}
          restore-keys: apt-playwright-v2-${{ steps.image.outputs.os }}-${{ steps.apt.outputs.packages }}-
      - name: Install Chromium system dependencies
        # Bounded update and download attempts inside; dpkg runs once, never killed midway.
        timeout-minutes: 12
        run: ./scripts/ci-playwright-deps.sh install ~/.cache/apt-playwright chromium
      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      # Over TCP: the image's init server listens on its socket only, so ready means the real
      # server. 90 s covers a cold pull plus initdb; a server that never answers fails the job.
      - name: Wait for Postgres
        env:
          WAIT_SECONDS: 90
        run: |
          for _ in $(seq "$WAIT_SECONDS"); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not accept TCP connections within ${WAIT_SECONDS} s"
          cat "$RUNNER_TEMP/postgres-start.log"
          docker logs postgres
          exit 1
      - name: Create roles and databases
        run: pnpm db:setup
      - name: Build for Node (served on https://localhost:4174 by the Lighthouse script)
        run: pnpm build:node
        env:
          ORIGIN: https://localhost:4174
      # Every app screen (incl. the streamed, DB-backed /profile), a fresh browser per run,
      # median of 5, stopping a route early once 3 runs decide it. Asserts the documented score target (>= 90); TBT gets 50% headroom over its
      # 200 ms target for shared-runner noise. The tight hydration guard is the main-thread
      # budget in the e2e job (e2e/perf.e2e.ts). See docs/performance.md.
      - name: Lighthouse (median of 5 runs, asserted)
        timeout-minutes: 11
        run: pnpm lighthouse --runs 5 --assert --min-perf 0.9 --max-tbt 300 --shard ${{ matrix.shard }}/${{ matrix.of }}
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: ignore

  # The check branch protection requires: green only when every shard is. It runs even when a
  # shard fails, since a skipped required check would count as passing.
  lighthouse:
    name: Lighthouse (mobile)
    if: ${{ always() }}
    needs: [lighthouse-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.lighthouse-shards.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error::Lighthouse shards: $SHARDS"
            exit 1
          fi

  # Desktop runs on a runner of its own, so the required mobile check (above) ends when its one
  # audit does instead of waiting about 2 minutes more for this one. Not a required check, and no
  # job needs it: it reports, it never blocks a merge.
  lighthouse-desktop:
    name: Lighthouse desktop (measured, not gating)
    # The e2e Chromium legs' image, as for the mobile shards above.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pulled and started in the background (docker run -d would block on the pull), so the
      # server boots while the job installs; "Wait for Postgres" holds db:setup until it answers.
      - name: Start Postgres 18 (in the background)
        run: nohup sh -c 'docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres postgres:18' > "$RUNNER_TEMP/postgres-start.log" 2>&1 &
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser builds are per OS release (WebKit links that release's ICU), so the cache is
      # keyed by the runner image: a WebKit downloaded on ubuntu-26.04 fails to launch on 24.04.
      - name: Runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The e2e legs' cached install (see the comment there): a full cache installs with no
      # network, so an Ubuntu mirror outage cannot fail the audit. Same image, same key: the
      # legs' saved copy restores here.
      - name: Playwright system packages
        id: apt
        run: ./scripts/ci-playwright-deps.sh key chromium >> "$GITHUB_OUTPUT"
      - name: Cache Playwright system packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-playwright
          key: apt-playwright-v2-${{ steps.image.outputs.os }}-${{ steps.apt.outputs.packages }}-${{ steps.apt.outputs.image }}
          restore-keys: apt-playwright-v2-${{ steps.image.outputs.os }}-${{ steps.apt.outputs.packages }}-
      - name: Install Chromium system dependencies
        # Bounded update and download attempts inside; dpkg runs once, never killed midway.
        timeout-minutes: 12
        run: ./scripts/ci-playwright-deps.sh install ~/.cache/apt-playwright chromium
      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      # Over TCP: the image's init server listens on its socket only, so ready means the real
      # server. 90 s covers a cold pull plus initdb; a server that never answers fails the job.
      - name: Wait for Postgres
        env:
          WAIT_SECONDS: 90
        run: |
          for _ in $(seq "$WAIT_SECONDS"); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not accept TCP connections within ${WAIT_SECONDS} s"
          cat "$RUNNER_TEMP/postgres-start.log"
          docker logs postgres
          exit 1
      - name: Create roles and databases
        run: pnpm db:setup
      - name: Build for Node (served on https://localhost:4174 by the Lighthouse script)
        run: pnpm build:node
        env:
          ORIGIN: https://localhost:4174
      # Desktop (1440 × 900) numbers on every PR head, in the step summary and the reports
      # artifact (lighthouse-reports/desktop). Measured, never gating: whether CI should assert
      # desktop (about 5 minutes per run) is an open owner decision (m2x plan), so a miss here
      # marks the step and leaves the job green. Same build and server setup as the mobile run.
      - name: Lighthouse desktop (median of 3 runs, measured, not gating)
        continue-on-error: true
        timeout-minutes: 8
        run: pnpm lighthouse --desktop --seed --runs 3 --assert
      - name: Upload Lighthouse desktop reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-desktop-${{ github.run_id }}
          path: lighthouse-reports/desktop/
          retention-days: 14
          if-no-files-found: ignore
