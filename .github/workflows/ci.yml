# Continuous integration: every pull request and every push to main.
# Jobs run in parallel; each is independently reproducible locally (see docs/testing.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Local-style databases inside the postgres:18 service container, created by db:setup
  # (postgres:18 matches the Neon production branch).
  DATABASE_URL: postgres://coach:coach@localhost:5432/coach_dev
  DATABASE_URL_UNPOOLED: postgres://coach:coach@localhost:5432/coach_dev
  TEST_DATABASE_URL: postgres://coach:coach@localhost:5432/coach_test
  E2E_DATABASE_URL: postgres://coach:coach@localhost:5432/coach_e2e
  PGADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier + ESLint incl. import boundaries)
        run: pnpm lint
      - name: Type-check (svelte-check + service worker tsc)
        run: pnpm check
      - name: Migrations match the schema (no drift)
        run: pnpm db:drift

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: pnpm db:setup
      - name: Apply migrations (dev database)
        run: pnpm db:migrate
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (real Postgres, committed migrations)
        run: pnpm test:integration

  build:
    name: Build (Vercel + Node) & budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for Vercel (production target)
        run: pnpm build
      - name: Build for Node (used by e2e and Lighthouse)
        run: pnpm build:node
      - name: Performance budgets
        run: pnpm budgets

  e2e:
    name: E2E (iPhone viewport · Chromium + WebKit)
    # Pinned to the newest Ubuntu release Playwright builds WebKit for (its browser builds are
    # "ubuntu-24.04"). On ubuntu-latest (26.04) WebKit's ~140 MB of system packages came
    # through a cold mirror at ~50 KB/s and the install timed out before any test ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # WebKit's system packages are ~140 MB, and the runner's Ubuntu mirror sometimes trickles
      # at ~50 KB/s (a 12-minute timeout on #5 before any test ran). Keep the downloaded
      # packages between runs so a slow mirror costs one run, not every run.
      - name: Cache Playwright system packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-v1
          restore-keys: apt-playwright-${{ runner.os }}-
      - name: Configure apt for slow mirrors (and keep packages for the cache)
        run: ./scripts/ci-apt-resilience.sh ~/.cache/apt-archives
      - name: Install Playwright system dependencies
        # Never killed midway: an interrupted apt-get keeps the dpkg lock and fails every later
        # install. Slow or stalled mirror downloads time out and retry inside apt instead.
        timeout-minutes: 12
        run: pnpm exec playwright install-deps chromium webkit
      - name: Make the kept packages readable for the cache
        run: ./scripts/ci-apt-resilience.sh --release ~/.cache/apt-archives
      - name: Install Playwright browsers
        # Usually restored from the cache above. A stuck download is safe to kill: bound and retry.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 pnpm exec playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::browser download attempt ${attempt} failed or timed out; retrying"
            sleep 5
          done
          echo "::error::browser download failed 3 times"
          exit 1
      - name: Create roles and databases
        run: pnpm db:setup
      - name: Playwright (global setup builds and starts the production Node server)
        run: pnpm test:e2e
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            .e2e-server.log
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Configure apt for slow mirrors
        run: ./scripts/ci-apt-resilience.sh
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      - name: Create roles and databases
        run: pnpm db:setup
      - name: Build for Node
        run: pnpm build:node
      # Every app screen (incl. the streamed, DB-backed /profile), a fresh browser per run,
      # median of 5. Asserts the documented score target (>= 90); TBT gets 50% headroom over its
      # 200 ms target for shared-runner noise. The tight hydration guard is the main-thread
      # budget in the e2e job (e2e/perf.e2e.ts). See docs/performance.md.
      - name: Lighthouse (median of 5 runs, asserted)
        run: pnpm lighthouse --runs 5 --assert --min-perf 0.9 --max-tbt 300
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: ignore
