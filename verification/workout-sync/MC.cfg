\* The scenario is in MC.tla. Mutation 2 is logged with a payload the
\* server rejects until the owner's Fix.
CONSTANTS
    Tabs = {"tab1", "tab2"}
    N = 3
    Dep <- MCDep
    Creates = {1}
    Invalid = {2}
    BatchCap = 2
    MaxFaults = 2
    MaxKeepalive = 1
    WebLocks = TRUE
    DiscardInFlight = FALSE
    MUTANT = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AppliedAtMostOnce
    AppliedInOrder
    NothingLost

PROPERTIES
    EventuallySynced
